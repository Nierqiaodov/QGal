# qgl 文件关联定义(供 jpackage 的 --file-associations 使用,只在安装包里生效)
#
# extension    : 文件后缀,不带点
# mime-type    : MIME 类型,Windows 上可任意但建议规范书写
# description  : 在资源管理器里显示的类型名
#
# 用法:mvn package -Pinstaller   (需要 WiX 3.x 或 Inno Setup 6)
extension=qgl
mime-type=application/x-qgal-package
description=QGal Package

